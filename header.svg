<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="heroBg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#161B26" />
      <stop offset="50%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>

    <!-- Top Neon Accent Glow -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.05" />
      <stop offset="35%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.7" />
      <stop offset="65%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Bottom Wave Line Gradient -->
    <linearGradient id="waveLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#454D60" fill-opacity="0.25" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="900" height="180" rx="10" fill="url(#heroBg)" />
  <rect width="900" height="180" rx="10" fill="url(#dotGrid)" />

  <!-- Outer Border -->
  <rect width="898" height="178" x="1" y="1" rx="9" fill="none" stroke="#222B3D" stroke-width="1.2" />

  <!-- Top Ambient Glow Line -->
  <path d="M 1 1 L 899 1" stroke="url(#neonGlow)" stroke-width="2.5" />

  <!-- Decorative Corner Brackets -->
  <path d="M 20 30 L 20 20 L 30 20" fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.6" />
  <path d="M 880 30 L 880 20 L 870 20" fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.6" />
  <path d="M 20 150 L 20 160 L 30 160" fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.6" />
  <path d="M 880 150 L 880 160 L 870 160" fill="none" stroke="#00F0FF" stroke-width="1.8" opacity="0.6" />


  <!-- Eyebrow Category -->
  <text x="45" y="44" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" fill="#00F0FF" letter-spacing="2" opacity="0.9">// APPLIED DATA SCIENCE &amp; ML SYSTEMS</text>

  <!-- Main Name Title -->
  <text x="44" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="1">ARFI ADI NUGROHO</text>

  <!-- Core Pipeline Subtitle -->
  <text x="45" y="132" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="500" fill="#9CA3AF" letter-spacing="1">PREDICTIVE MODELING  ·  COMPUTER VISION  ·  AGENTIC AI  ·  MLOPS</text>

  <!-- Subtle Bottom Wave Path -->
  <path d="M 0 165 Q 225 152 450 165 T 900 165" fill="none" stroke="url(#waveLine)" stroke-width="1.5" />
</svg>
